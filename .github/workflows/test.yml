name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # runtime.txt (Streamlit Cloud) 와 동일한 버전을 유지할 것.
          python-version: "3.12"
          cache: pip

      - name: Install Korean fonts for matplotlib
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          # matplotlib 폰트 캐시를 새로 만들어 findfont 경고를 줄인다
          rm -rf ~/.cache/matplotlib

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        env:
          MPLBACKEND: Agg
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        # live 마커는 실제 OpenAI API 를 호출하므로 CI 에서 제외한다.
        run: pytest -q -m "not live" -ra
