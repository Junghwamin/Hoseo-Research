[pytest]
# `testpaths = tests` 는 일부러 쓰지 않는다. pytest 는 `_decide_args` 를 두 번
# 호출하는데(config/__init__.py:1262 warn=False, :1575 warn=True), 그 사이에
# 초기 conftest 를 import 한다. 우리 `tests/conftest.py` 는 모듈 레벨에서
# 샌드박스로 chdir 하므로(6.2-1) 2차 호출의 `glob.iglob("tests")` 가 항상 실패해
# PytestConfigWarning 을 내고 어차피 invocation_dir 로 폴백한다.
# 그래서 수집 범위는 아래 norecursedirs/python_files 로만 제한한다.
#
# `scripts/smoke_test.py` 는 이름이 `*_test.py` 라 pytest 의 기본 수집 규칙에
# 걸리는데, 모듈 본문에서 sys.exit(0) 을 호출해 수집 단계에서 INTERNALERROR 를
# 낸다. 경로 인자 없이 `pytest` 를 돌리면(=CI 기본형) 스위트 전체가 죽는다.
# python_files 에서 `*_test.py` 를 빼고, norecursedirs 로 한 번 더 막는다.
norecursedirs = scripts installer .venv-qa .git output "Raw data" 전임교원_연구실적_학교별자료
python_files = test_*.py
addopts = --timeout=300 -ra
markers =
    realdata: git 에 추적된 실제 Raw/output 데이터를 사용
    slow: 수 초 이상 걸리는 테스트
    live: 실제 외부 API 호출 (기본 제외)
    characterization: 현재(결함 포함) 동작을 기록만 하는 테스트. 수정 시 함께 갱신
    needs_refactor: 프로덕션 코드 추출 없이는 단위 테스트가 불가해 관측 경계에서 잠근 테스트
filterwarnings =
    ignore:A value is trying to be set on a copy of a slice from a DataFrame
    ignore::DeprecationWarning:streamlit.*
xfail_strict = true
